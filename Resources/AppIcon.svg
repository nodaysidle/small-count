<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Small Count app icon</title>
  <desc id="description">A midnight rounded square containing three luminous count marks and a coral plus symbol.</desc>
  <defs>
    <linearGradient id="background" x1="150" y1="90" x2="860" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#242044"/>
      <stop offset="1" stop-color="#111426"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="220" x2="0" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6D8"/>
      <stop offset="1" stop-color="#FFD76A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#080A16" flood-opacity="0.46"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
