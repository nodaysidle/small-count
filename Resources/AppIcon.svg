  </defs>
  <rect x="52" y="52" width="920" height="920" rx="222" fill="url(#background)" filter="url(#shadow)"/>
  <path d="M174 694C286 816 450 870 626 842" fill="none" stroke="#7770FF" stroke-width="28" stroke-linecap="round" opacity="0.22"/>
  <circle cx="749" cy="261" r="132" fill="#FF715B" opacity="0.18" filter="url(#glow)"/>
  <g fill="url(#mark)">
    <rect x="220" y="298" width="112" height="428" rx="56"/>
    <rect x="404" y="240" width="112" height="486" rx="56"/>
    <rect x="588" y="354" width="112" height="372" rx="56"/>
  </g>
  <g transform="translate(712 214)">
