    <path d="M-46 0H46M0-46V46" fill="none" stroke="#FFF9EE" stroke-width="30" stroke-linecap="round"/>
  </g>
  <rect x="52" y="52" width="920" height="920" rx="222" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.12"/>
